<!DOCTYPE html>
<html lang="pt-BR">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="css/style.css">
   <link rel="stylesheet" href="css/pages/profile.css">
   <script src="js/api.js" defer></script>
   <script src="js/components.js" defer></script>
   <script src="js/main.js" defer></script>
   <script src="js/avatar.js" defer></script>
   <script src="js/profile.js" defer></script>
   <title>Perfil | CooperaCom</title>
</head>
<body>

<header id="navbar"></header>

<div id="imgModal" class="modal">
    <span id="modalClose" class="close-btn">&times;</span>
    <img class="modal-content" id="modalImg">
</div>

<main class="profile-container">

    <h1 class="profile-title">Perfil</h1>

 <section class="profile-header">
<input type="file" id="avatar-input" accept="image/*" style="display:none">
  <div class="profile-left">
    <div class="profile-avatar">
      <img id="user-avatar" src="img/default-avatar.png" alt="Foto do usuário" style="cursor:pointer;">
    </div>
    <h2 id="user-name">Carregando...</h2>
    <p id="user-bio">...</p>
  </div>

  <div class="profile-right">
    <h3>Projetos Criados (<span id="created-count">0</span>)</h3>

    <div id="created-projects" class="projects-container"></div>

    <a href="my-projects.html" class="see-more">Ver mais projetos</a>
  </div>
 </section>


    <section class="profile-volunteer">
        <h3>Voluntariado em (<span id="vol-count">0</span>)</h3>

        <div id="volunteer-projects" class="projects-container"></div>

        <a href="voluntario-projects.html" class="see-more">Ver mais projetos</a>
    </section>

</main>

<footer id="footer"></footer>

</body>
</html>
